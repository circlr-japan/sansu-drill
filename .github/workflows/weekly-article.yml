name: 週次自動記事生成

on:
  schedule:
    # 毎週月曜日 午前9時 (JST = UTC 0:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 手動実行も可能

jobs:
  generate-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Anthropic SDK インストール
        run: pip install anthropic

      - name: 記事を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/generate_weekly_article.py

      - name: 変更をコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet || git commit -m "週次記事追加 $(date '+%Y-%m-%d')"
          git push
